[package]
name = "sctui"
version = "0.3.0"
description = "a soundcloud client for the terminal"
authors = ["Will Murphy <illogicallledits@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
color-eyre = "0.6.3"
anyhow = "1"
base64 = "0.22"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tiny_http = "0.12"
webbrowser = "1.1"
# rustls instead of the platform OpenSSL so Linux release binaries run on any distro.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2"] }
serde_json = "1.0.149"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = {version = "1.47.1", features = ["rt-multi-thread"] }
rodio = "0.21.1"
ratatui-image = "8.0.1"
image = "0.25.9"
m3u8-rs = "6.0"
rustfft = "6.4.1"

# OS media integration: MPNowPlayingInfoCenter (macOS), SMTC (Windows), MPRIS (Linux, zbus).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Hidden window for SMTC; version matches souvlaki's.
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
